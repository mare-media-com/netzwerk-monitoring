services:
  monitor-server:
    image: monitor-server
    container_name: monitor-server
    build:
      context: .
      network: host
    ports:
      - "5000:5000"
    environment:
      - TZ=Europe/Berlin
    volumes:
      - ./server.py:/app/server.py
      - ./logs:/app/logs
      - ./templates:/app/templates
      - ./static:/app/static
    restart: unless-stopped
    extra_hosts:
      - "raspibernd:192.168.178.110"
      - "raspi4b:192.168.178.53"

