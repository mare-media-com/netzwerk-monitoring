<!DOCTYPE html>
<html>
<head>
    <title>Netzwerk-Monitoring</title>
    <!-- <meta http-equiv="refresh" content="10"> -->
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <script src="https://cdn.jsdelivr.net/npm/raphael@2.3.0/raphael.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/justgage@1.3.5/justgage.min.js"></script>
</head>
<body>

<h1 class="header">
  🌐 Netzwerk-Monitoring
  <span class="mqtt-values">
    <span>Raumklima im Büro: </span>

    <span class="status-group">
      <span id="temp-led" class="status-led"></span>
      <span id="temp-display" class="mqtt-value">🌡️ -- °C</span>
    </span>

     <span class="status-group">
      <span id="hum-led" class="status-led"></span>
      <span id="hum-display" class="mqtt-value">💧 -- %</span>
    </span>

  </span>
</h1>

<!-- ===================== -->
<!-- CARDS -->
<!-- ===================== -->
<div class="status-grid">

    <!-- ===================== -->
    <!-- Internet -->
    <!-- ===================== -->

    <div id="internetCard" class="card">
        <h3>Internet</h3>

        <p class="statusanzeige">
            Status: <span id="internetStatus">-</span>
        </p>

        <small class="muted">
            Latenz: <span id="internetLatency" class="latency">–</span>
        </small>

        <div id="internetFailureBlock" class="muted"></div>
        <div id="internetStatsBlock" class="muted stats"></div>
    </div>


    <!-- ===================== -->
    <!-- FRITZ!Box -->
    <!-- ===================== -->

    <div id="fritzCard" class="card">
        <h3>FRITZ!Box</h3>

        <p class="statusanzeige">
            Status: <span id="fritzStatus">-</span>
        </p>

        <small class="muted">
            Latenz: <span id="fritzLatency" class="latency">–</span>
        </small>

        <div id="fritzFailureBlock" class="muted"></div>
        <div id="fritzStatsBlock" class="muted stats"></div>
    </div>


    <!-- ===================== -->
    <!-- Raspi4b -->
    <!-- ===================== -->

    <div id="raspi4bCard" class="card">
        <h3>raspi4b</h3>

        <p class="statusanzeige">
            Status: <span id="raspi4bStatus">-</span>
        </p>

        <small class="muted">
            Latenz: <span id="raspi4bLatency" class="latency">–</span>
        </small>

        <div id="raspi4bFailureBlock" class="muted"></div>
        <div id="raspi4bStatsBlock" class="muted stats"></div>
    </div>


    <!-- ===================== -->
    <!-- raspibernd -->
    <!-- ===================== -->

    <div class="card">
        <h3>raspibernd</h3>

        <label>🌡 CPU-Temp</label>
        <div id="cpuGauge" style="width:120px;height:90px;"></div>

        <div class="progress-container">
            <label>🧠 RAM</label>
            <div id="ramText"></div>
            <div class="progress">
                <div id="ramBar" class="progress-bar"></div>
            </div>
        </div>

        <div class="progress-container">
            <label>💾 SD-Card</label>
            <div id="sdText"></div>
            <div class="progress">
                <div id="sdBar" class="progress-bar"></div>
            </div>
        </div>
    </div>

</div>

<!-- ===================== -->
<!-- Timelines -->
<!-- ===================== -->

<div class="status-grid">

    <div class="timeline">
        <h4>📊 Internet</h4>
        <div id="internetTimeline"></div>
    </div>

    <div class="timeline">
        <h4>📊 FRITZ!Box</h4>
        <div id="fritzTimeline"></div>
    </div>

    <div class="timeline">
        <h4>📊 raspi4b</h4>
        <div id="raspi4bTimeline"></div>
    </div>

    <div class="timeline">
        <h4>📊 raspibernd</h4>
        <div id="raspiberndTimeline"></div>
    </div>

</div>

<script>
const renderedEvents = {
    internet: new Set(),
    fritzbox: new Set(),
    raspi4b: new Set(),
    raspibernd: new Set()
};

/* ===================== */
/* Gauge */
/* ===================== */

let cpuGauge = new JustGage({
    id: "cpuGauge",
    value: 0,
    min: 30,
    max: 90,
    title: "CPU Temperature",
    label: "°C",
    decimals: 2,
    valueFontColor: "#ffffff",
    titleFontColor: "#ffffff",
    labelFontColor: "#ffffff",
    gaugeColor: "#808080",   // hellgrau
    levelColors: ["#33ff57", "#ffc107", "#ff5733"]
});


/* ===================== */
/* Helpers */
/* ===================== */

function updateCardState(cardId, isOk) {

    const card = document.getElementById(cardId);
    if (!card) return;

    card.classList.remove("ok", "fail");
    card.classList.add(isOk ? "ok" : "fail");
}


function setLatency(id, value) {

    const el = document.getElementById(id);
    if (!el) return;

    if (value === null || value === undefined) {
        el.innerHTML = "–";
        return;
    }

    let color = value < 50 ? "green" :
                value <= 100 ? "yellow" :
                               "red";

    el.className = `latency ${color}`;
    el.innerHTML = `⏱ ${value} ms`;
}


/* ===================== */
/* RAM */
/* ===================== */

function updateRam(percent, usedMB, totalMB) {

    const freeMB = totalMB - usedMB;

    let dotColor = percent > 85 ? "#ff5733" :
                   percent > 75 ? "#ffc107" :
                                  "#33ff57";

    document.getElementById("ramText").innerHTML =
        `<span class="status-dot" style="background:${dotColor}"></span>
         Used: ${usedMB.toFixed(2)}MB (${percent.toFixed(2)}%)<br>
         Free: ${freeMB.toFixed(2)}MB | Total: ${totalMB.toFixed(2)}MB`;

    document.getElementById("ramBar").style.width = percent + "%";
}


/* ===================== */
/* SD */
/* ===================== */

function updateSd(percent, usedGB, totalGB) {

    const freeGB = totalGB - usedGB;

    let dotColor = percent > 80 ? "#ff5733" :
                   percent > 60 ? "#ffc107" :
                                  "#33ff57";

    document.getElementById("sdText").innerHTML =
        `<span class="status-dot" style="background:${dotColor}"></span>
         Used: ${usedGB.toFixed(2)}GB (${percent.toFixed(2)}%)<br>
         Free: ${freeGB.toFixed(2)}GB | Total: ${totalGB.toFixed(2)}GB`;

    document.getElementById("sdBar").style.width = percent + "%";
}


/* ===================== */
/* Failure Renderer */
/* ===================== */

function renderFailure(blockId, data, prefix) {

    const block = document.getElementById(blockId);
    if (!block) return;

    if (!data[`${prefix}_fail_start`]) {
        block.innerHTML = `<small>✅ Noch kein Ausfall</small>`;
        return;
    }

    block.innerHTML = `
        <small>
            ❌ Zuletzt ausgefallen: ${data[`${prefix}_fail_start`]}<br>
            🕒 Dauer: ${data[`${prefix}_fail_duration_text`]}
        </small>
    `;
}

function renderStats(blockId, data, prefix) {

    const block = document.getElementById(blockId);
    if (!block) return;

    const availability = data[`${prefix}_availability_7d`];

    let dotColor = "#33ff57";        // Default grün

    if (availability !== null && availability !== undefined) {
        if (availability < 99) dotColor = "#ff5733";      // rot
        else if (availability < 99.9) dotColor = "#ffc107"; // gelb
    }

    block.innerHTML = `
        <small>
            ⚡ Ausfälle 24h: ${data[`${prefix}_outages_24h`] ?? "-"}<br>
            📅 Ausfälle 7 Tage: ${data[`${prefix}_outages_7d`] ?? "-"}<br>
            ❌ Downtime 7 Tage: ${data[`${prefix}_downtime_7d`] ?? "-"}<br>
            <span class="status-dot" style="background:${dotColor}"></span>
             Verfügbarkeit 7 Tage: ${data[`${prefix}_availability_7d`] ?? "-"} %
        </small>
    `;
}

/* ===================== */
/* Timeline Renderer */
/* ===================== */

function renderTimeline(containerId, events, key) {

    const el = document.getElementById(containerId);
    if (!el || !events) return;

    events.forEach(event => {

        const eventId = `${event.time}-${event.state}`;

        // Bereits vorhanden? → überspringen
        if (renderedEvents[key].has(eventId)) return;

        renderedEvents[key].add(eventId);

        const div = document.createElement("div");
        div.className = `event ${event.state.toLowerCase()} new-event`;

        div.innerHTML = `${event.time} | ${event.state}`;

        el.prepend(div); // NEUE EVENTS OBEN ⭐
    });
}

/* ===================== */
/* Main Update */
/* ===================== */

function updateServerStatus(data) {

    if (!data.servers) return;

    document.getElementById("internetStatus").innerHTML =
        data.servers.internet ? "🟢 OK" : "🔴 FAIL";

    document.getElementById("fritzStatus").innerHTML =
        data.servers.fritzbox ? "🟢 OK" : "🔴 FAIL";

    document.getElementById("raspi4bStatus").innerHTML =
        data.servers.raspi4b ? "🟢 OK" : "🔴 FAIL";

    updateCardState("internetCard", data.servers.internet);
    updateCardState("fritzCard",    data.servers.fritzbox);
    updateCardState("raspi4bCard",  data.servers.raspi4b);

    setLatency("internetLatency", data.servers.internet_latency);
    setLatency("fritzLatency",    data.servers.fritzbox_latency);
    setLatency("raspi4bLatency",  data.servers.raspi4b_latency);

    renderFailure("internetFailureBlock", data, "inet");
    renderStats("internetStatsBlock", data, "inet");
    renderFailure("fritzFailureBlock",    data, "fritz");
    renderStats("fritzStatsBlock", data, "fritz");
    renderFailure("raspi4bFailureBlock",  data, "raspi4b");
    renderStats("raspi4bStatsBlock", data, "raspi4b");

    renderTimeline("internetTimeline",   data.timelines?.internet,   "internet");
    renderTimeline("fritzTimeline",      data.timelines?.fritzbox,   "fritzbox");
    renderTimeline("raspi4bTimeline",    data.timelines?.raspi4b,    "raspi4b");
    renderTimeline("raspiberndTimeline", data.timelines?.raspibernd, "raspibernd");
}


/* ===================== */
/* Fetch */
/* ===================== */

function fetchStats() {

    fetch("/debug")
        .then(res => res.json())
        .then(data => {

            if (data.cpu !== null)
                cpuGauge.refresh(parseFloat(data.cpu));

            if (data.ram !== null) {
                const totalRAM = 909.6;
                const usedRAM = totalRAM * data.ram / 100;
                updateRam(data.ram, usedRAM, totalRAM);
            }

            if (data.sd !== null) {
                const totalSD = 28.95;
                const usedSD = totalSD * data.sd / 100;
                updateSd(data.sd, usedSD, totalSD);
            }

            updateServerStatus(data);
        });
}

setInterval(fetchStats, 15000);
fetchStats();

</script>

<script src="static/js/mqtt.js"></script>

</body>
</html>
